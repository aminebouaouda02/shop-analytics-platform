spring:
  application:
    name: shop-analytics-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/shopanalytics
    username: shop
    password: shop_dev_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

server:
  port: 8080

logging:
  level:
    com.amine.shopanalytics: DEBUG
