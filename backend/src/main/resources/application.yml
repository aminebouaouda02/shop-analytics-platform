spring:
  application:
    name: shop-analytics-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/shopanalytics
    username: shop
    password: shop_dev_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

server:
  port: 8080

springdoc:
  # Interactive docs: http://localhost:8080/swagger-ui.html
  # Raw OpenAPI JSON: http://localhost:8080/v3/api-docs
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  seed:
    # Demo data: off by default. Start the backend with SEED_ENABLED=true
    # to create the demo account and sample rows (only into empty tables).
    enabled: ${SEED_ENABLED:false}
    # Local demo password only — never a real account. Change with DEMO_PASSWORD.
    demo-password: ${DEMO_PASSWORD:demo12345}
  analytics:
    # Folder the Spark job writes its result JSON into; the
    # /api/analytics/sales endpoint reads the file from here.
    # Relative to the backend working directory when run locally.
    results-dir: ${ANALYTICS_RESULTS_DIR:../big-data/output}
  jwt:
    # Dev default only — set the JWT_SECRET environment variable in production.
    # Must be at least 32 characters (256 bits) for HS256.
    secret: ${JWT_SECRET:dev-only-secret-key-change-me-in-production-0123456789}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

logging:
  level:
    com.amine.shopanalytics: DEBUG
