services:
  postgres:
    image: postgres:16-alpine
    container_name: shop-analytics-postgres
    environment:
      POSTGRES_DB: shopanalytics
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shopanalytics"]
      interval: 5s
      timeout: 3s
      retries: 5

